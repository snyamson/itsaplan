name: Desk images

# Publishes the four service images of this fork on every push to main, tagged with the
# commit sha and `latest`. The fork takes its version from upstream, so it cuts no
# releases of its own: release.yml and cla.yml are disabled in the repository's Actions
# settings, and this workflow is what publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a build still in flight; only the head of main is deployed.
concurrency:
  group: desk-images
  cancel-in-progress: true

jobs:
  publish:
    name: Publish images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      tag: ${{ github.sha }}
